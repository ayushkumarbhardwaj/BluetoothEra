<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120d0b" />
    <title>BluetoothEra — Old Songs. Old Memories.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <div class="background"></div>
      <div class="overlay"></div>

      <header class="topbar">
        <span id="clock">12:55 am</span>
        <div class="online">
          <span class="online-dot"></span
          ><span><strong id="onlineCount">29</strong> online</span>
        </div>
        <nav class="top-right">
          <a
            id="spotifyLink"
            href="https://open.spotify.com/"
            target="_blank"
            rel="noopener noreferrer"
            ><span class="circle-icon">●</span> Spotify</a
          >
          <a
            id="youtubeLink"
            href="https://music.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
            ><span class="circle-icon">▶</span> YT Music</a
          >
        </nav>
      </header>

      <section class="hero">
        <p class="eyebrow">2010 — 2015 · HINDI / PUNJABI NOSTALGIA</p>
        <h1>BluetoothEra</h1>
        <p class="tagline">Old songs. Old memories.</p>
        <button id="heroPlay" class="hero-play" type="button">
          <span id="heroPlayIcon">▶</span
          ><span id="heroPlayText">Play BluetoothEra</span>
        </button>
      </section>

      <section id="player" class="player" aria-label="Music player">
        <div class="cover-wrap">
          <img
            id="cover"
            src="assets/covers/default.jpeg"
            alt="Current song artwork"
          />
        </div>
        <div class="track-info">
          <div id="trackTitle" class="track-title">Zara Sa</div>
          <div id="trackArtist" class="track-artist">KK</div>
          <div class="progress-row">
            <span id="currentTime">0:00</span>
            <input
              id="progress"
              type="range"
              min="0"
              max="100"
              value="0"
              step="0.1"
              aria-label="Song progress"
            />
            <span id="duration">0:00</span>
          </div>
        </div>
        <div class="controls">
          <button
            id="prev"
            class="control"
            type="button"
            aria-label="Previous song"
          >
            |◀
          </button>
          <button
            id="playPause"
            class="control play-control"
            type="button"
            aria-label="Play"
          >
            ▶
          </button>
          <button
            id="next"
            class="control"
            type="button"
            aria-label="Next song"
          >
            ▶|
          </button>
        </div>
        <div id="playerStatus" class="player-status">
          Add your licensed audio files to /audio
        </div>
      </section>

      <footer>Tuning in to the Bluetooth generation 🎧</footer>
      <audio id="audio" preload="metadata"></audio>
    </main>
    <script src="script.js"></script>
  </body>
</html>
